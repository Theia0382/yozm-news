name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR 은 번호별로 묶어 새 push 가 이전 실행을 취소한다 — docs/development/infrastructure.md "CI"
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# 검사는 로컬과 같은 정의 · 같은 명령으로 돈다. job · 캐시 · 보고서는 docs/development/infrastructure.md "CI"
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/bake-action@v7
        with:
          source: .
          files: compose.check.yaml
          targets: backend
          load: true
          set: |
            *.cache-from=type=gha,scope=backend
            *.cache-to=type=gha,scope=backend,mode=max
      - name: Check
        id: check
        run: docker compose -f compose.check.yaml up --force-recreate --attach backend --abort-on-container-exit --exit-code-from backend backend docker
      # 검사 단계가 실패했을 때만 보고서를 모은다 — docs/development/infrastructure.md "CI"
      - name: Collect test reports
        if: failure() && steps.check.outcome == 'failure'
        run: |
          mkdir -p backend-test-reports
          docker compose -f compose.check.yaml cp backend:/workspace/backend/build/reports/tests/test backend-test-reports/html
          docker compose -f compose.check.yaml cp backend:/workspace/backend/build/test-results/test backend-test-reports/xml
      - name: Upload test reports
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend-test-reports/
          retention-days: 7

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/bake-action@v7
        with:
          source: .
          files: compose.check.yaml
          targets: frontend
          load: true
          set: |
            *.cache-from=type=gha,scope=frontend
            *.cache-to=type=gha,scope=frontend,mode=max
      - name: Check
        run: docker compose -f compose.check.yaml run --rm frontend

  # 공개 마크다운의 상대 링크 · 앵커(tools/docs-check)
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/bake-action@v7
        with:
          source: .
          files: compose.check.yaml
          targets: docs
          load: true
          set: |
            *.cache-from=type=gha,scope=docs
            *.cache-to=type=gha,scope=docs,mode=max
      - name: Check
        run: docker compose -f compose.check.yaml run --rm docs

  # 배포 구성의 두 아키텍처 빌드 · 기동 · 스모크 — docs/development/infrastructure.md "CI"
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # 배포 구성의 필수 값 — CI 에서만 쓰는 일회성 값이고 비밀 값이 아니다
      POSTGRES_PASSWORD: ci-smoke-only
      YOZMNEWS_COLLECTION_CONTACT: https://github.com/Theia0382/yozm-news/issues
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # 빌더에 arm64 에뮬레이션이 없어야 한다 — docs/development/infrastructure.md "CI"
      - name: Check tools and builder platforms
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version
          docker buildx version
          platforms=$(docker buildx inspect --bootstrap | grep '^Platforms:')
          echo "$platforms"
          if grep -q arm64 <<<"$platforms"; then
            echo "빌더에 arm64 에뮬레이션이 있다 — 두 아키텍처 빌드가 실행 단계의 RUN 을 잡지 못한다" >&2
            exit 1
          fi
      # bake 를 deploy/ 에서 돌린다 — docs/development/infrastructure.md "이미지"
      - name: Build images (linux/amd64, linux/arm64)
        uses: docker/bake-action@v7
        with:
          source: ./deploy
          files: compose.yaml
          targets: app,proxy
          set: |
            *.platform=linux/amd64,linux/arm64
            *.cache-from=type=gha,scope=deploy
            *.cache-to=type=gha,scope=deploy,mode=max
      - name: Load images (linux/amd64)
        uses: docker/bake-action@v7
        with:
          source: ./deploy
          files: compose.yaml
          targets: app,proxy
          load: true
          set: |
            *.cache-from=type=gha,scope=deploy
      - name: Start
        run: docker compose -f deploy/compose.yaml up -d --no-build --wait
      - name: Smoke
        run: bash deploy/smoke.sh
      - name: Logs
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color
