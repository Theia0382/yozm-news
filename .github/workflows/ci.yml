name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR 은 번호별로 묶어 새 push 가 이전 실행을 취소한다 — docs/development/infrastructure.md "CI"
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# 검사는 로컬과 같은 정의 · 같은 명령으로 돈다. job · 캐시 · 보고서는 docs/development/infrastructure.md "CI"
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/bake-action@v7
        with:
          source: .
          files: compose.check.yaml
          targets: backend
          load: true
          set: |
            *.cache-from=type=gha,scope=backend
            *.cache-to=type=gha,scope=backend,mode=max
      - name: Check
        id: check
        run: docker compose -f compose.check.yaml up --force-recreate --attach backend --abort-on-container-exit --exit-code-from backend backend docker
      # 검사 단계가 실패했을 때만 보고서를 모은다 — docs/development/infrastructure.md "CI"
      - name: Collect test reports
        if: failure() && steps.check.outcome == 'failure'
        run: |
          mkdir -p backend-test-reports
          docker compose -f compose.check.yaml cp backend:/workspace/backend/build/reports/tests/test backend-test-reports/html
          docker compose -f compose.check.yaml cp backend:/workspace/backend/build/test-results/test backend-test-reports/xml
      - name: Upload test reports
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend-test-reports/
          retention-days: 7

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/bake-action@v7
        with:
          source: .
          files: compose.check.yaml
          targets: frontend
          load: true
          set: |
            *.cache-from=type=gha,scope=frontend
            *.cache-to=type=gha,scope=frontend,mode=max
      - name: Check
        run: docker compose -f compose.check.yaml run --rm frontend

  # 공개 마크다운의 상대 링크 · 앵커(tools/docs-check)
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/bake-action@v7
        with:
          source: .
          files: compose.check.yaml
          targets: docs
          load: true
          set: |
            *.cache-from=type=gha,scope=docs
            *.cache-to=type=gha,scope=docs,mode=max
      - name: Check
        run: docker compose -f compose.check.yaml run --rm docs

  # 저장소 도구(tools/)마다 단위 테스트 — 사건 평가 도구의 운영자 API 명세 대조 · 라벨 기준 판 대조 포함
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/bake-action@v7
        with:
          source: .
          files: compose.check.yaml
          targets: tools
          load: true
          set: |
            *.cache-from=type=gha,scope=tools
            *.cache-to=type=gha,scope=tools,mode=max
      - name: Check
        run: docker compose -f compose.check.yaml run --rm tools

  # 배포 구성의 두 아키텍처 빌드 · 기동 · 스모크를 아키텍처마다 그 아키텍처의 러너에서 한다 — 두 job 은 러너와 상대 아키텍처만 다르다.
  # 체크 이름은 deploy-amd64 · deploy-arm64. docs/development/infrastructure.md "CI"
  deploy:
    name: deploy-${{ matrix.native }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # 한쪽의 실패가 다른 아키텍처의 확인을 취소하지 않는다
      fail-fast: false
      matrix:
        include:
          - { native: amd64, other: arm64, runner: ubuntu-24.04 }
          - { native: arm64, other: amd64, runner: ubuntu-24.04-arm }
    env:
      # 배포 구성의 필수 값 — CI 에서만 쓰는 일회성 값이고 비밀 값이 아니다
      POSTGRES_PASSWORD: ci-smoke-only
      YOZMNEWS_COLLECTION_CONTACT: https://github.com/Theia0382/yozm-news/issues
      # 형식만 맞는 일회성 값 — 스모크 덧씌우기가 Jev 주소를 닿지 않는 곳으로 두어 K14 의 시험 기사도 Jev 로 요청하지 않는다
      YOZMNEWS_JEV_API_KEY: ci-smoke-only-not-a-jev-key
      # 스모크 덧씌우기 — 시험 피드 서버로 K14(로컬 모델 추론 한 건)를 돌린다. CI 는 K14 를 건너뛰지 않는다
      SMOKE_OVERLAY: deploy/smoke/compose.yaml
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # 빌더에 상대 아키텍처의 에뮬레이션이 없어야 한다 — docs/development/infrastructure.md "CI"
      - name: Check tools and builder platforms
        env:
          OTHER: ${{ matrix.other }}
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version
          docker buildx version
          platforms=$(docker buildx inspect --bootstrap | grep '^Platforms:')
          echo "$platforms"
          if grep -q "$OTHER" <<<"$platforms"; then
            echo "빌더에 $OTHER 에뮬레이션이 있다 — 두 아키텍처 빌드가 실행 단계의 RUN 을 잡지 못한다" >&2
            exit 1
          fi
      # bake 를 deploy/ 에서 돌린다 — docs/development/infrastructure.md "이미지". 빌드 단계는 빌더 플랫폼에서 돌아 캐시를 job 마다 나눈다
      - name: Build images (linux/amd64, linux/arm64)
        uses: docker/bake-action@v7
        with:
          source: ./deploy
          files: compose.yaml
          targets: app,proxy
          set: |
            *.platform=linux/amd64,linux/arm64
            *.cache-from=type=gha,scope=deploy-${{ matrix.native }}
            *.cache-to=type=gha,scope=deploy-${{ matrix.native }},mode=max
      - name: Load images (linux/${{ matrix.native }})
        uses: docker/bake-action@v7
        with:
          source: ./deploy
          files: compose.yaml
          targets: app,proxy
          load: true
          set: |
            *.cache-from=type=gha,scope=deploy-${{ matrix.native }}
      - name: Start
        run: docker compose -f deploy/compose.yaml -f "$SMOKE_OVERLAY" up -d --no-build --wait
      - name: Smoke
        run: bash deploy/smoke.sh
      # 운영자 토큰을 넣은 구성 — app 만 토큰과 함께 다시 띄워 같은 스모크를 돌린다(K13 의 토큰 갈래 · K14). docs/development/infrastructure.md "CI"
      # 덧씌우기를 함께 준다 — 빠지면 app 이 수집 허용 대역 · Jev 주소 없이 다시 만들어진다
      - name: Restart app with an operator token
        env:
          # CI 에서만 쓰는 일회성 값이고 비밀 값이 아니다 — job env 에 두면 첫 Start 부터 토큰이 들어가 토큰 없는 갈래를 돌리지 않는다
          YOZMNEWS_ADMIN_TOKEN: ci-smoke-only-operator-token-0123456789
        run: docker compose -f deploy/compose.yaml -f "$SMOKE_OVERLAY" up -d --no-build --wait app
      - name: Smoke (operator token)
        env:
          SMOKE_REQUIRE_K14: "1"
        run: bash deploy/smoke.sh
      - name: Logs
        if: failure()
        run: docker compose -f deploy/compose.yaml -f "$SMOKE_OVERLAY" logs --no-color
