# 검사 환경 — CI 와 로컬이 같은 정의를 쓴다. 실행 명령은 CONTRIBUTING.md §1.
name: yozmnews-check

services:
  backend:
    image: yozmnews-check-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: check
    environment:
      # Testcontainers 는 아래 docker 서비스(DinD)를 쓴다 — docs/development/infrastructure.md "검사 환경"
      DOCKER_HOST: tcp://docker:2375
      TESTCONTAINERS_HOST_OVERRIDE: docker
    depends_on:
      docker:
        condition: service_healthy

  frontend:
    image: yozmnews-check-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: check

  docs:
    image: yozmnews-check-docs
    build:
      context: .
      dockerfile: tools/docs-check/Dockerfile

  docker:
    image: docker:29-dind
    privileged: true
    # TLS 를 끄면 기동 지연이 없다. 엔진의 노출 범위는 docs/development/infrastructure.md "검사 환경"
    command: ["--tls=false"]
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - dind-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  dind-data:
