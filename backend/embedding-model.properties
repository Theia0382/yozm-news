# 기본 로컬 임베딩 모델의 정본 — 빌드(fetchEmbeddingModel)와 앱(EmbeddingModel)이 함께 읽는다 · docs/specs/event.md §4 · ADR-0091
# 받는 곳: https://huggingface.co/{repository}/resolve/{revision}/{경로}
repository=intfloat/multilingual-e5-small
revision=614241f622f53c4eeff9890bdc4f31cfecc418b3
model.path=onnx/model_qint8_avx512_vnni.onnx
model.sha256=dd476dd0c2514e9b9be83aeb3853fac0763e0bdf4a71645407587d77c48a2d88
tokenizer.path=onnx/tokenizer.json
tokenizer.sha256=0b44a9d7b51c3c62626640cda0e2c2f70fdacdc25bbbd68038369d14ebdf4c39
# model.path · tokenizer.path · input-prefix 가운데 하나라도 바꾸면 model-version 도 바꾼다 — 같은 버전 문자열에 다른 벡터가 오지 않게(ADR-0075)
model-version=intfloat/multilingual-e5-small@614241f6:qint8
dimensions=384
# 끝 공백을 \u0020 으로 적는다 — 저장소의 .editorconfig 가 끝 공백을 지운다
input-prefix=query:\u0020
