# 테스트에서만 main 의 application.yaml 위에 더하는 설정 — classpath:/config/ 는 Spring Boot 기본 위치 가운데 뒤에 읽힌다.
# 같은 이름의 classpath:/application.yaml 을 test 에 두면 main 의 파일을 가리므로 이 위치에 둔다.
yozmnews:
  collection:
    # 수집 연락처는 필수다(없으면 앱이 뜨지 않는다). 테스트는 실제 피드를 받지 않는다
    contact: https://github.com/Theia0382/yozm-news/issues
  jev:
    # Jev 키는 작업 역할의 필수 설정이다(없으면 앱이 뜨지 않는다). 형식만 맞는 시험 값이고, 기본 주소는 닿지 않는 주소라
    # 반복 작업이 돌아도 실제 Jev 로 요청하지 않는다
    api-key: test-key-not-a-real-jev-key
    base-url: http://127.0.0.1:9
  embedding:
    # 작업 역할은 임베더가 필수다. 시험은 닿지 않는 주소의 외부 방식으로 띄운다 — 반복 작업이 돌아도 실제로 요청하지 않는다
    provider: openai-compatible
    openai-compatible:
      base-url: http://127.0.0.1:9
      model: test-model
      dimensions: 256
  credential:
    # KEK 파일은 필수다(없으면 앱이 뜨지 않는다). 시험용 파일은 시험 DB 의 키만 감싼다
    kek-file: classpath:credential/test-kek
