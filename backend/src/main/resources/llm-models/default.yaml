# 기본 허용 모델 목록 — 형식과 규칙은 docs/specs/llm.md §5 "공급자와 허용 모델 목록"(llm-R2 ~ R4).
# 운영자가 자기 파일을 가리키면 이 목록 대신 그 파일이 목록 전체가 된다 — docs/operations/configuration.md "허용 모델 목록".
# input-token-budget 은 다이제스트 한 번의 입력 상한이다 — 공급자 입력 한도 초과와 비용 최악값을 막는 안전 상한이고, 평소 분량은 최대 후보 수가 정한다(llm-R4).
# 공급자마다 첫 모델이 기본이다 — 사용자가 고르지 않았거나 고른 모델을 쓸 수 없으면 유효한 키가 있는 공급자의 첫 모델을 쓴다(docs/specs/user.md user-R51).
providers:
  openai:
    models:
      - id: gpt-6.1-terra
        input-token-budget: 120000
        structured-output: true
      - id: gpt-6.1-sol
        input-token-budget: 120000
        structured-output: true
      - id: gpt-6-luna
        input-token-budget: 120000
        structured-output: true
      - id: gpt-6-astra
        input-token-budget: 120000
        structured-output: true
  anthropic:
    models:
      - id: claude-sonnet-5-5
        input-token-budget: 120000
        structured-output: true
      - id: claude-opus-5-5
        input-token-budget: 120000
        structured-output: true
      - id: claude-haiku-5-5
        input-token-budget: 120000
        structured-output: true
      - id: claude-fable-5-2
        input-token-budget: 120000
        structured-output: true
  # OpenRouter 는 여러 회사의 모델을 중계한다 — ID 는 OpenRouter 의 모델 ID(회사/모델)다. 2026-11-17 공개 목록으로 확인.
  openrouter:
    models:
