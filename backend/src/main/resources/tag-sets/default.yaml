importance:
  - level: 1
    description: "결과도 관심도 당사자와 그 주변에 그치는 사안"
  - level: 2
    description: "영향이나 관심이 한 업계 · 지역 · 집단 안에 머무는 사안"
  - level: 3
    description: "영향이 여러 업계 · 지역 · 집단에 걸치지만 사회 전반의 제도나 흐름은 바꾸지 않는 사안, 결과가 아직 정해지지 않은 다툼 · 주장"
  - level: 4
    description: "사회 전반의 제도나 정치 · 경제의 흐름을 바꾸거나 바꿀 것이 분명한 사안"
  - level: 5
    description: "나라 전체의 진로나 국제 질서를 크게 바꾸는 사안"
