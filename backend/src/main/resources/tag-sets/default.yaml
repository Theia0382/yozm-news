# 기본 태그 체계 — 첫 기동에 버전이 하나도 없으면 버전 1로 들어간다(docs/specs/tag.md §5 · tag-R1 · R2).
# 이미 적재한 인스턴스는 이 파일이 바뀌어도 따라가지 않는다.
# 형식은 tag-R5 — 중분류 key 는 조각만 적고, 저장 키는 대분류 키를 붙인 전체 키(politics.executive)다.
questions:
  topic: "이 기사가 주요하게 다루는 주제가 다음에 해당하는가: {description}"
  region: "이 기사의 주요 무대가 다음에 해당하는가: {description}"
  format: "이 기사의 형식은 무엇인가"
  importance: "이 기사가 다루는 사안은 얼마나 중요한가. 등장하는 인물이나 다루는 주제가 아니라 사안이 실제로 바꾸거나 일으킨 일의 크기와 그 영향이 미치는 범위로 판단한다. 발언 · 주장 · 반응은 그것이 일으킨 일만큼으로 본다"
thresholds:
  topic:
    tagThreshold: 0.5
    storeThreshold: 0.1
  region:
    tagThreshold: 0.5
    storeThreshold: 0.1
