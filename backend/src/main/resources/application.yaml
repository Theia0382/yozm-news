spring:
  application:
    name: yozmnews
  profiles:
    # 역할 profile 을 하나도 켜지 않으면 두 역할을 함께 한다 — docs/specs/platform.md §7 · platform-R8
    default: web,worker
  docker:
    compose:
      # 개발용 Compose 연동은 local 프로필에서만 켠다 (application-local.yaml)
      enabled: false
  modulith:
    events:
      jdbc:
        schema-initialization:
          # 스키마의 정본은 Flyway 마이그레이션이다. 이 키가 없으면 Modulith 가 기동 때 테이블을 만든다
          enabled: false
      # 완료된 발행은 바로 지운다 — docs/specs/platform.md §5 · platform-R5
      completion-mode: delete
      staleness:
        # 세 상태 모두 같은 값이어야 한다 — docs/specs/platform.md §5 · platform-R2
        published: ${yozmnews.events.stale-after}
        processing: ${yozmnews.events.stale-after}
        resubmitted: ${yozmnews.events.stale-after}

jobrunr:
  database:
    # 스키마의 정본은 Flyway 마이그레이션이다 — JobRunr 는 만들지 않고 테이블이 있는지만 본다
    skip-create: true
  background-job-server:
    # 기본 구성은 두 역할(화면 · 백그라운드 작업)을 함께 하는 프로세스 하나다
    enabled: true
    # 작업 서버 동시 실행 수 — docs/operations/configuration.md "백그라운드 작업". 측정 전 목표값이고, 운영 데이터로 다시 판단한다
    worker-count: ${YOZMNEWS_JOB_WORKERS:16}
  dashboard:
    # 대시보드는 켜지 않는다 — docs/operations/deployment.md "헬스 체크와 관측"
    enabled: false
  miscellaneous:
    # 대시보드를 켜더라도 사용 통계를 내보내지 않는다
    allow-anonymous-data-usage: false

yozmnews:
  events:
    # 멈춤 기준 — docs/specs/platform.md §7 · platform-R2. 리스너는 짧은 처리여야 한다 — ADR-0023
    stale-after: PT30M
    # 재제출 주기 — docs/specs/platform.md §7 · platform-R3
    resubmission-interval: PT5M

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

springdoc:
  api-docs:
    # 명세 엔드포인트는 기본으로 끈다 — docs/specs/platform.md §5 · platform-R6
    enabled: false
  # 화면용 API 만 명세에 넣는다 — platform-R6
  paths-to-match: /api/**
  default-produces-media-type: application/json
  # 출력을 고정한다 — platform-R6
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  model-converters:
    java-nullable-property-customizer:
      # JSpecify @Nullable 속성을 null 허용 타입으로 낸다
      enabled: true
