# 배포 구성 — proxy · app · postgres. 실행 방법은 docs/operations/deployment.md "배포 구성 실행".
# 운영 값은 이 디렉터리의 .env 에서 받는다(.env.example). 개발용 구성은 저장소 루트 compose.yaml(프로필 dev).
# 프로젝트 이름을 고정한다 — 디렉터리 이름이 바뀌어도 같은 DB 볼륨을 쓰고, checkout 디렉터리 이름을 따르는 개발용 프로젝트와 겹치지 않는다.
name: yozmnews-deploy

# DB 이름 · 계정의 정의는 이 한 곳이다 — postgres 와 app 이 함께 읽는다.
x-database: &database
  POSTGRES_DB: yozmnews
  POSTGRES_USER: yozmnews
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 deploy/.env 에 적는다}

services:
  postgres:
    # 이미지 · healthcheck · 볼륨 경로는 개발용 정의를 물려받는다 — PostgreSQL 이미지의 정본은 저장소 루트 compose.yaml 이다
    extends:
      file: ../compose.yaml
      service: postgres
    profiles: !reset []
    # 호스트에 공개하지 않는다
    ports: !reset []
    environment: *database
    restart: unless-stopped

  app:
    image: yozmnews-app
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: app
    environment:
      <<: *database
      # 앱은 표준 이름으로 받는다. 값은 위 정의를 컨테이너 안에서 Spring 이 풀어 쓴다($$ 는 Compose 보간을 피한다)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/$${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: $${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: $${POSTGRES_PASSWORD}
      # 수집 요청의 User-Agent 에 밝히는 운영자 연락처 — 없으면 앱이 뜨지 않는다
      YOZMNEWS_COLLECTION_CONTACT: ${YOZMNEWS_COLLECTION_CONTACT:?YOZMNEWS_COLLECTION_CONTACT 를 deploy/.env 에 적는다}
      # 수집이 연결해도 되는 내부 대역(CIDR, 쉼표 구분) — 비우면 내부 주소를 모두 막는다
      YOZMNEWS_COLLECTION_ALLOWED_NETWORKS: ${YOZMNEWS_COLLECTION_ALLOWED_NETWORKS:-}
      # 동시에 실행하는 백그라운드 작업 수 — 값을 적지 않는다: deploy/.env 에 있을 때만 넘기고, 없으면 앱의 기본값을 쓴다
      YOZMNEWS_JOB_WORKERS:
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 이미지에 curl · wget 이 없어 bash 의 /dev/tcp 로 묻는다. DB 가 죽으면 health 가 503 이거나 응답이 timeout 보다 늦다
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

  proxy:
    image: yozmnews-proxy
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      target: proxy
    ports:
      # 이 호스트에서만 접속하는 것이 기본이다. Tunnel 없이 직접 공개할 때만 .env 로 주소를 바꾼다
      - "${PROXY_HOST_ADDRESS:-127.0.0.1}:${PROXY_HOST_PORT:-8000}:8080"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # proxy 자신의 정적 응답만 본다 — 앱 상태는 앱의 healthcheck 가 본다
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    restart: unless-stopped

volumes:
  postgres-data:
