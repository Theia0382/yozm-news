# 배포 구성 — proxy · app · postgres. 실행 방법은 docs/operations/deployment.md "배포 구성 실행".
# 운영 값은 이 디렉터리의 .env 에서 받는다 — docs/operations/configuration.md
# 프로젝트 이름을 고정한다 — docs/operations/deployment.md "배포 구성 실행"
name: yozmnews-deploy

# DB 이름 · 계정의 정의는 이 한 곳이다 — postgres 와 app 이 함께 읽는다.
x-database: &database
  POSTGRES_DB: yozmnews
  POSTGRES_USER: yozmnews
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 deploy/.env 에 적는다}

services:
  postgres:
    # 이미지 · healthcheck · 볼륨 경로는 개발용 정의를 물려받는다 — docs/development/infrastructure.md "PostgreSQL 이미지 정본"
    extends:
      file: ../compose.yaml
      service: postgres
    profiles: !reset []
    # 호스트에 공개하지 않는다
    ports: !reset []
    environment: *database
    restart: unless-stopped

  app:
    image: yozmnews-app
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: app
    environment:
      <<: *database
      # 두 역할(화면 · 작업)을 한 프로세스에서 한다 — docs/operations/deployment.md "서비스"
      SPRING_PROFILES_ACTIVE: web,worker
      # 앱은 표준 이름으로 받는다. 값은 위 정의를 컨테이너 안에서 Spring 이 풀어 쓴다($$ 는 Compose 보간을 피한다)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/$${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: $${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: $${POSTGRES_PASSWORD}
      # 운영자 연락처(필수) — docs/operations/configuration.md "피드 수집"
      YOZMNEWS_COLLECTION_CONTACT: ${YOZMNEWS_COLLECTION_CONTACT:?YOZMNEWS_COLLECTION_CONTACT 를 deploy/.env 에 적는다}
      # 수집이 연결해도 되는 내부 대역 — docs/operations/configuration.md "피드 수집"
      YOZMNEWS_COLLECTION_ALLOWED_NETWORKS: ${YOZMNEWS_COLLECTION_ALLOWED_NETWORKS:-}
      # 운영자 토큰(비밀 값) — 없으면 운영자 기능이 닫힌다. docs/operations/configuration.md "운영자"
      YOZMNEWS_ADMIN_TOKEN: ${YOZMNEWS_ADMIN_TOKEN:-}
      # 첫 운영자 이메일 · 초기 비밀번호(비밀 값) — 운영자 계정이 없을 때 이 값으로 운영자 계정을 만든다. deploy/.env 에 있을 때만 넘긴다.
      # docs/operations/configuration.md "계정과 고지"
      YOZMNEWS_FIRST_ADMIN_EMAIL:
      YOZMNEWS_FIRST_ADMIN_PASSWORD:
      # 작업 서버 동시 실행 수 — 기본값을 적지 않는다(deploy/.env 에 있을 때만 넘긴다). docs/operations/configuration.md "백그라운드 작업"
      YOZMNEWS_JOB_WORKERS:
      # 공유 평가 Jev 키(비밀 값, 필수 — 작업 역할은 키 없이 뜨지 않는다). 모델 · 기본 주소는 deploy/.env 에 있을 때만 넘긴다.
      # docs/operations/configuration.md "공유 평가"
      YOZMNEWS_JEV_API_KEY: ${YOZMNEWS_JEV_API_KEY:?YOZMNEWS_JEV_API_KEY 를 deploy/.env 에 적는다}
      YOZMNEWS_JEV_MODEL:
      YOZMNEWS_JEV_BASE_URL:
      # 사건 묶기의 사건 기준 · 저장 기준 · 닫는 기간 · 최대 기간 — deploy/.env 에 있을 때만 넘긴다.
      # docs/operations/configuration.md "사건 묶기"
      YOZMNEWS_EVENT_ASSIGNMENT_WINDOW:
      YOZMNEWS_EVENT_ASSIGNMENT_UPPER:
      YOZMNEWS_EVENT_ASSIGNMENT_LOWER:
      YOZMNEWS_EVENT_ASSIGNMENT_STORE:
      YOZMNEWS_EVENT_ASSIGNMENT_PROBABILITY:
      YOZMNEWS_EVENT_ASSIGNMENT_CLOSE_AFTER:
      YOZMNEWS_EVENT_ASSIGNMENT_MAX_OPEN:
      # 스토리라인 잇기의 시간 창 · 기준 점수 — deploy/.env 에 있을 때만 넘긴다. docs/operations/configuration.md "스토리라인 잇기"
      YOZMNEWS_STORYLINE_LINKING_WINDOW:
      YOZMNEWS_STORYLINE_LINKING_THRESHOLD:
      # 스토리라인 관계의 확률 기준 · 한 사안 기준 · 사건 수 하한 · 후보 점수 기준 · 시간 창 — deploy/.env 에 있을 때만 넘긴다.
      # docs/operations/configuration.md "스토리라인 관계"
      YOZMNEWS_STORYLINE_RELATION_PROBABILITY:
      YOZMNEWS_STORYLINE_RELATION_ONE_MATTER:
      YOZMNEWS_STORYLINE_RELATION_MIN_EVENTS:
      YOZMNEWS_STORYLINE_RELATION_CANDIDATE_SCORE:
      YOZMNEWS_STORYLINE_RELATION_WINDOW:
      # 스토리라인 상태의 잠잠 기간 · 끝남 기간 — deploy/.env 에 있을 때만 넘긴다. docs/operations/configuration.md "스토리라인 상태"
      YOZMNEWS_STORYLINE_STATE_QUIET_AFTER:
      YOZMNEWS_STORYLINE_STATE_ENDED_AFTER:
      # 사건 묶기의 임베딩 방식(기본 onnx — 이미지 안의 로컬 모델)과 외부 방식(openai-compatible)의 주소 · 모델 · 키(비밀 값) · 차원 ·
      # 차원 전송 · 입력 앞 문자열 · 묶음 크기 — deploy/.env 에 있을 때만 넘긴다. docs/operations/configuration.md "사건 묶기"
      YOZMNEWS_EMBEDDING_PROVIDER:
      YOZMNEWS_EMBEDDING_OPENAI_COMPATIBLE_BASE_URL:
      YOZMNEWS_EMBEDDING_OPENAI_COMPATIBLE_MODEL:
      YOZMNEWS_EMBEDDING_OPENAI_COMPATIBLE_API_KEY:
      YOZMNEWS_EMBEDDING_OPENAI_COMPATIBLE_DIMENSIONS:
      YOZMNEWS_EMBEDDING_OPENAI_COMPATIBLE_SEND_DIMENSIONS:
      YOZMNEWS_EMBEDDING_OPENAI_COMPATIBLE_INPUT_PREFIX:
      YOZMNEWS_EMBEDDING_OPENAI_COMPATIBLE_BATCH_SIZE:
      # 허용 모델 목록의 운영자 파일 — 컨테이너 안 경로(/etc/yozmnews/…). docs/operations/configuration.md "허용 모델 목록"
      YOZMNEWS_LLM_MODELS_FILE:
      # LLM 키 암호화 키(KEK) 파일 — 컨테이너 안 경로. 기본은 설정 디렉터리의 kek 이고 파일이 없으면 앱이 뜨지 않는다.
      # docs/operations/configuration.md "LLM 키 암호화"
      YOZMNEWS_CREDENTIAL_KEK_FILE: ${YOZMNEWS_CREDENTIAL_KEK_FILE:-/etc/yozmnews/kek}
    volumes:
      # 운영자가 앱에 넘기는 파일을 두는 설정 디렉터리 — 읽기 전용. z 는 SELinux 호스트에서 컨테이너가 읽게 한다.
      # docs/operations/deployment.md "서비스"
      - ./config:/etc/yozmnews:ro,z
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 이미지에 curl · wget 이 없어 bash 의 /dev/tcp 로 묻는다. DB 가 죽으면 health 가 503 이거나 응답이 timeout 보다 늦다
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

  proxy:
    image: yozmnews-proxy
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      target: proxy
    ports:
      # 기본은 이 호스트에서만 접속 — docs/operations/configuration.md "공개"
      - "${PROXY_HOST_ADDRESS:-127.0.0.1}:${PROXY_HOST_PORT:-8000}:8080"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # proxy 자신의 정적 응답만 본다 — 앱 상태는 앱의 healthcheck 가 본다
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    restart: unless-stopped

volumes:
  postgres-data:
